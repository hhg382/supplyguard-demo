<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="수입의존 핵심품목의 공급망 위험을 공공데이터 활용 구조로 점검하는 SupplyGuard 서비스 화면">
  <meta property="og:title" content="SupplyGuard 공급망 위험 분석">
  <meta property="og:description" content="HS 품목, 국가 의존도, 뉴스 리스크, 재고 완충일을 함께 보는 공급망 위험 분석 서비스">
  <title>SupplyGuard | 공급망 위험 분석</title>
  <style>
    :root{--brand:#245d63;--brand-strong:#17484e;--accent:#8a5a2b;--ink:#16202a;--muted:#516070;--line:#d9e0e8;--surface:#f4f7fb;--paper:#fff;--tint:#eef7f2;--good:#0f766e;--warn:#9a5b13;--bad:#a83232;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--radius:10px;--shadow:0 16px 40px rgba(22,32,42,.08)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden}body{font-family:Pretendard,Apple SD Gothic Neo,Segoe UI,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at top left,rgba(36,93,99,.11),transparent 34rem),var(--surface);line-height:1.58;letter-spacing:0}button,input,select{font:inherit}button{border:0;border-radius:8px;background:var(--brand);color:#fff;min-height:44px;padding:0 var(--s4);font-weight:750;cursor:pointer;transition:transform .12s ease-out,background .2s ease,box-shadow .2s ease}button:hover{background:var(--brand-strong);box-shadow:0 8px 18px rgba(36,93,99,.18)}button:active{transform:translateY(1px) scale(.99)}button.secondary{background:#e6edf2;color:var(--ink)}button.secondary:hover{background:#dce6ed}button.ghost{background:transparent;color:var(--brand);border:1px solid var(--line);box-shadow:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(36,93,99,.24);outline-offset:2px}a{color:var(--brand);overflow-wrap:anywhere}.skip{position:absolute;left:-999px;top:8px;background:#fff;color:var(--ink);padding:8px 12px;border-radius:8px;z-index:20}.skip:focus{left:8px}.feedback{position:fixed;right:16px;bottom:18px;background:#10202a;color:#fff;border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .18s ease,transform .18s ease;z-index:30;max-width:min(420px,calc(100vw - 24px));pointer-events:none}.feedback.show{opacity:1;transform:translateY(0)}.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100dvh}.side{background:#10202a;color:#fff;padding:var(--s6);position:sticky;top:0;height:100dvh}.brand{font-size:24px;font-weight:850;margin-bottom:var(--s2)}.side-note{font-size:12px;color:#b9d8d4;margin-bottom:var(--s6);word-break:keep-all}.nav{display:grid;gap:var(--s2)}.nav button{justify-content:flex-start;background:transparent;color:#d9edf0;text-align:left;box-shadow:none}.nav button:hover,.nav button.active{background:rgba(255,255,255,.12);color:#fff}.main{min-width:0;padding:var(--s6);display:grid;gap:var(--s5);max-width:1280px;width:100%;margin:0 auto}.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:var(--s5);align-items:stretch}.hero-copy,.hero-card,.panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}.hero-copy{padding:var(--s8)}.eyebrow{font-size:12px;font-weight:800;color:var(--brand);margin:0 0 var(--s3);word-break:keep-all}.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.12;margin:0 0 var(--s4);word-break:keep-all}.title-line,.phrase{display:inline-block}.hero p{max-width:68ch;color:var(--muted);margin:0;word-break:keep-all}.hero-actions{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s5)}.hero-card{padding:var(--s5);display:grid;gap:var(--s3);background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(238,247,242,.92))}.risk-value{font-size:42px;font-weight:850;font-variant-numeric:tabular-nums}.status-pill{display:inline-flex;align-items:center;width:max-content;min-height:28px;padding:0 var(--s3);border-radius:999px;background:#e7f5f1;color:var(--good);font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--s4)}.panel{padding:var(--s5)}.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}.panel h2,.panel h3{margin:0 0 var(--s3);word-break:keep-all}.panel h2{font-size:22px}.panel h3{font-size:17px}.label{font-size:12px;color:var(--muted);font-weight:800}.muted{color:var(--muted)}.kpi{display:grid;gap:var(--s2)}.kpi strong{font-size:26px;font-variant-numeric:tabular-nums}.meter{height:9px;border-radius:999px;background:#e5ebef;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#6fa59a);width:30%;transition:width .22s ease}.evidence{border-color:#a7d8cf;background:linear-gradient(180deg,rgba(238,247,242,.94),rgba(255,255,255,.88))}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}.source-card{border:1px solid #b8ddd5;border-radius:8px;background:#fff;padding:var(--s3);min-width:0}.source-card strong{display:block;color:var(--brand);font-size:18px}.source-card p{margin:var(--s1) 0 0;color:var(--muted);font-size:13px}.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}.field{display:grid;gap:var(--s1)}.field label{font-size:12px;color:var(--muted);font-weight:800}.field input,.field select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}.actions{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}.toolbar{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}.toolbar input{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:min(320px,100%)}.table-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}th{background:#f8fafb;color:#344453;font-weight:800}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.selected{background:#edf7f5}.report{white-space:pre-wrap;background:#11202a;color:#edf5f7;border-radius:8px;padding:var(--s4);min-height:260px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}.chip{display:inline-flex;align-items:center;min-height:28px;border:1px solid var(--line);border-radius:999px;padding:0 10px;background:#fff;color:var(--muted);font-size:12px;font-weight:700;margin:2px}.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}.step{border-left:3px solid var(--brand);background:#f9fbfc;border-radius:8px;padding:var(--s3)}.mobilebar{display:none}.status-good{color:var(--good)}.status-warn{color:var(--warn)}.status-bad{color:var(--bad)}.footer{font-size:12px;color:var(--muted);padding-bottom:var(--s2)}@media(max-width:1024px){.app{grid-template-columns:1fr}.side{display:none}.hero{grid-template-columns:1fr}.main{padding:var(--s4)}.span-3,.span-4,.span-5,.span-6,.span-7,.span-8{grid-column:span 6}.cards,.form,.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:768px){body{padding-bottom:72px}.main{padding:14px 14px 18px}.hero-copy{padding:var(--s5)}.hero h1{font-size:28px}.grid,.cards,.form,.flow{grid-template-columns:1fr}.span-3,.span-4,.span-5,.span-6,.span-7,.span-8,.span-12{grid-column:span 1}table{display:table;min-width:680px}.actions button{flex:1 1 126px}.feedback{left:12px;right:12px;bottom:82px}.mobilebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px;gap:6px;z-index:10;overflow:hidden}.mobilebar button{min-width:0;min-height:50px;padding:0 6px;font-size:12px}.mobilebar button.active{background:var(--brand);color:#fff}.panel{padding:var(--s4)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <a class="skip" href="#content">본문으로 이동</a>
  <div class="app">
    <aside class="side" aria-label="서비스 메뉴">
      <div class="brand">SupplyGuard</div>
      <div class="side-note" id="sideStatus">공공데이터 활용 구조 기반 서비스</div>
      <div class="nav" id="nav"></div>
    </aside>
    <main class="main" id="content">
      <section class="hero" aria-labelledby="pageTitle">
        <div class="hero-copy">
          <p class="eyebrow">수입의존 핵심품목 공급망 경보</p>
          <h1 id="pageTitle"><span class="title-line">서플라이가드</span> <span class="title-line">공급망 위험 분석</span></h1>
          <p>KOTRA 산업부 공공데이터 활용 구조와 관세청 수출입실적 API 일부 샘플 응답을 바탕으로, HS 품목별 의존도와 대응 우선순위를 한 화면에서 점검합니다.</p>
          <div class="hero-actions">
            <button id="sampleBtn" type="button">샘플 입력</button>
            <button class="secondary" id="saveBtn" type="button">분석 저장</button>
            <button class="ghost" id="resetBtn" type="button">초기화</button>
          </div>
        </div>
        <div class="hero-card" aria-live="polite">
          <span class="status-pill" id="sampleStatus">검증 샘플 반영</span>
          <div>
            <div class="label">통합 위험점수</div>
            <div class="risk-value" id="heroRisk">-</div>
          </div>
          <p class="muted" id="heroSummary">품목과 국가 의존도를 입력하면 위험점수와 대응 우선순위가 갱신됩니다.</p>
        </div>
      </section>
      <section id="view"></section>
      <p class="footer">공개 화면에는 인증정보와 원본 요청 URL을 포함하지 않습니다. 전체 원본 데이터 대조는 별도 검증 단계에서 수행합니다.</p>
    </main>
  </div>
  <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
  <nav class="mobilebar" id="mobilebar" aria-label="모바일 메뉴"></nav>
  <script>
    const CONFIG={name:"SupplyGuard",storageId:"publicdata:supplyguard:polished",inputs:[["company","기업명","한빛소재"],["hsCode","HS 코드","280461"],["itemName","품목명","실리콘 웨이퍼 원재료"],["importTotal","월 수입액(만달러)",860],["topShare","1위 국가 비중(%)",64],["secondShare","2위 국가 비중(%)",18],["thirdShare","3위 국가 비중(%)",9],["newsHits","위험 뉴스 건수",7],["stockDays","재고일수",24],["criticality","생산 중요도(1~10)",9],["threshold","경보 임계점",70],["supplierCount","대체 공급처 수",2]],data:[["한국무역현황 상세통계","KOTRA","15140428","HS코드·국가·수출입액","핵심 산업부 데이터 구조"],["국가정보","KOTRA","15034830","국가·경제·정치·시장정보","국가 리스크 보정"],["해외시장뉴스","KOTRA","15034831","통상 뉴스·국가·품목","위험 신호 탐지"],["품목별 국가별 수출입실적","관세청","보조 샘플","수입액·수출액","일부 샘플 응답 확인"],["KIPRIS 특허정보","특허청","보조 후보","특허·기술분류","대체 기술 후보 설계"]],candidates:[["280461","고순도 실리콘",91,71,12],["850760","리튬이온 배터리",84,63,8],["854231","집적회로",76,54,5],["290243","p-자일렌",68,47,4],["280530","희토류 금속",87,69,10]]};
    const FALLBACK_SAMPLE={dataStatus:"관세청 보조 샘플 확인",publicStatus:"검증 샘플 반영 예시 데이터",source:"관세청 수출입실적 API 일부 샘플 응답 확인",kotraStatus:"KOTRA 데이터는 서비스 핵심 공공데이터로 설계 반영",kiprisStatus:"KIPRIS 데이터는 대체기술 보조 데이터로 설계 반영",items:[{hsCode:"8542",countryCode:"US",periodLabel:"조회 기준 기간",importUsd:"227207303",exportUsd:"60050850",balanceUsd:"-",source:"관세청 품목별 국가별 수출입실적 API 일부 샘플 응답"}],scoreInputs:{newsHits:7,topShare:64,criticality:9,supplierCount:2,stockDays:24},limitations:["브라우저는 인증정보 없이 정적 JSON만 읽습니다.","관세청 수출입실적은 기타 보조 샘플로만 사용합니다.","KOTRA 원본 파일 대조와 KIPRIS 세부 호출 검증은 별도 단계입니다."]};
    const tabs=[["overview","대시보드"],["inputs","분석 입력"],["candidates","품목 후보"],["report","리포트"],["sources","데이터"],["logic","산정 로직"],["settings","내보내기"]];
    let current=new URLSearchParams(location.search).get("view")||"overview";if(!tabs.some(([id])=>id===current))current="overview";
    const mobileTabs=tabs.filter(([id])=>["overview","inputs","candidates","report"].includes(id));
    let selected=0;let sampleData=FALLBACK_SAMPLE;let sampleReady=false;let state=load();
    function load(){try{return {...Object.fromEntries(CONFIG.inputs.map(([field,,value])=>[field,value])),...JSON.parse(localStorage.getItem(CONFIG.storageId)||"{}")}}catch{return Object.fromEntries(CONFIG.inputs.map(([field,,value])=>[field,value]))}}
    function save(){localStorage.setItem(CONFIG.storageId,JSON.stringify(state));render();notify("분석 입력값을 이 브라우저에 저장했습니다.")}
    function num(k){const value=Number(state[k]);return Number.isFinite(value)?value:0}
    async function loadSample(){if(location.protocol==="file:"){render();return}try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),2500);const response=await fetch("data/supplyguard-sample.json",{cache:"no-store",signal:controller.signal});clearTimeout(timer);if(response.ok){sampleData={...FALLBACK_SAMPLE,...await response.json()};sampleReady=true;if(sampleData.scoreInputs&&!localStorage.getItem(CONFIG.storageId))state={...state,...sampleData.scoreInputs}}}catch(error){sampleReady=false}render()}
    function money(value){return Number(value).toLocaleString("ko-KR",{maximumFractionDigits:1})}
    function moneyUsd(value){const parsed=Number(value);return Number.isFinite(parsed)?parsed.toLocaleString("ko-KR")+" 달러":"확인 필요"}
    function calc(){const shares=[num("topShare"),num("secondShare"),num("thirdShare"),Math.max(0,100-num("topShare")-num("secondShare")-num("thirdShare"))];const hhi=shares.reduce((sum,value)=>sum+value*value,0);const news=Math.min(100,num("newsHits")*9+num("criticality")*3);const risk=Math.min(100,hhi/100+news*.25+num("criticality")*2-num("supplierCount")*3-num("stockDays")*.2);return {"HHI":hhi,"단일국 의존도":num("topShare"),"뉴스 리스크":news,"재고 완충일":num("stockDays"),"통합 위험점수":risk}}
    function candidateScore(row){const metrics=calc();const base=Object.values(metrics).reduce((sum,value)=>sum+Number(value||0),0)/Object.keys(metrics).length;return Math.max(0,Math.min(100,row[2]*.55+base*.35-row[4]*1.5+row[3]*.1))}
    function riskLevel(score){if(score>=80)return "고위험";if(score>=65)return "주의";return "관찰"}
    function nav(){document.getElementById("nav").innerHTML=tabs.map(navButton).join("");document.getElementById("mobilebar").innerHTML=mobileTabs.map(navButton).join("")}
    function navButton([id,label]){return '<button type="button" class="'+(current===id?"active":"")+'" onclick="current=\''+id+'\';render()">'+label+'</button>'}
    function kpis(){const metrics=calc();return '<div class="grid">'+Object.entries(metrics).map(([metric,value])=>'<article class="panel span-3 kpi"><span class="label">'+metric+'</span><strong>'+money(value)+'</strong><div class="meter"><span style="width:'+Math.max(8,Math.min(100,Number(value)%110))+'%"></span></div></article>').join("")+'</div>'}
    function evidencePanel(){const item=sampleData.items?.[0]||FALLBACK_SAMPLE.items[0];return '<section class="panel evidence span-12"><h2>데이터 활용 상태</h2><p class="muted"><span class="phrase">공개 화면은 인증정보 없는 정적 JSON을 읽습니다.</span> <span class="phrase">관세청 수출입실적 API 일부 샘플 응답을 보조 근거로 반영했습니다.</span></p><div class="cards"><div class="source-card"><span class="label">상태</span><strong>'+dataStatusLabel()+'</strong><p>서비스 화면은 예시 입력값과 검증 샘플 지표를 함께 사용합니다.</p></div><div class="source-card"><span class="label">관세청 샘플</span><strong>'+item.hsCode+' · '+item.countryCode+'</strong><p>수입 '+moneyUsd(item.importUsd)+' / 수출 '+moneyUsd(item.exportUsd)+'</p></div><div class="source-card"><span class="label">KOTRA·KIPRIS</span><strong>설계 반영</strong><p>KOTRA는 핵심 공공데이터 구조, KIPRIS는 보조 후보로 표시합니다.</p></div></div></section>'}
    function inputs(){return '<section class="panel span-12"><h2>분석 입력</h2><div class="form">'+CONFIG.inputs.map(([field,label])=>'<div class="field"><label for="'+field+'">'+label+'</label><input id="'+field+'" value="'+escapeHtml(state[field]??"")+'" oninput="state[\''+field+'\']=this.value;renderSoft()"></div>').join("")+'</div></section>'}
    function renderSoft(){document.querySelectorAll("[data-soft]").forEach(node=>node.innerHTML=kpis()+reportPreview(false));updateHero()}
    function candidateRows(){const query=(document.getElementById("search")?.value||"").trim();return CONFIG.candidates.filter(row=>query===""||row.join(" ").includes(query)).map((row,index)=>'<tr class="'+(CONFIG.candidates[selected]===row?"selected":"")+'" onclick="selected='+CONFIG.candidates.indexOf(row)+';render()"><td>'+row[0]+'</td><td>'+row[1]+'</td><td>'+row[2]+'</td><td>'+row[3]+'</td><td>'+row[4]+'</td><td><strong>'+money(candidateScore(row))+'</strong></td></tr>').join("")}
    function candidates(){return '<section class="panel span-12"><div class="toolbar"><div><h2>대응 후보</h2><p class="muted">품목별 대체 조달·재고 대응 우선순위를 비교합니다. 모바일에서는 표를 좌우로 밀어 전체 항목을 확인합니다.</p></div><input id="search" placeholder="HS 코드 또는 품목 검색" oninput="document.querySelector(&quot;tbody&quot;).innerHTML=candidateRows()"></div><div class="actions"><button class="secondary" type="button" onclick="sortCandidates()">위험점수 정렬</button><button class="ghost" type="button" onclick="selected=(selected+1)%CONFIG.candidates.length;render()">다음 후보</button></div><div class="table-wrap" aria-label="좌우 스크롤 가능한 후보 비교표"><table><thead><tr><th>HS 코드</th><th>품목</th><th>기준점수</th><th>개선효과</th><th>투자/리스크</th><th>위험점수</th></tr></thead><tbody>'+candidateRows()+'</tbody></table></div></section>'}
    function sortCandidates(){CONFIG.candidates.sort((a,b)=>candidateScore(b)-candidateScore(a));selected=0;render()}
    function sources(){return '<section class="panel span-12"><h2>공공데이터 근거</h2><p class="muted">산업부·산하기관 공공데이터를 핵심 구조로 두고, 관세청 수출입실적은 보조 샘플로 분리합니다. 인증이 필요한 호출은 브라우저에서 수행하지 않습니다.</p><div class="cards">'+CONFIG.data.map(row=>'<div class="source-card"><span class="label">'+row[1]+' · '+row[2]+'</span><strong>'+row[0]+'</strong><p>'+row[3]+'</p><p>'+row[4]+'</p></div>').join("")+'</div></section>'}
    function logic(){return '<section class="panel span-12"><h2>위험 산정 로직</h2><div class="flow"><div class="step"><strong>1. 품목 식별</strong><p>HS 코드와 품목명을 기준으로 분석 단위를 고정합니다.</p></div><div class="step"><strong>2. 의존도 계산</strong><p>상위 국가 비중으로 HHI와 단일국 의존도를 계산합니다.</p></div><div class="step"><strong>3. 리스크 보정</strong><p>뉴스 신호, 생산 중요도, 재고 완충일을 반영합니다.</p></div><div class="step"><strong>4. 대응 우선순위</strong><p>대체 공급처 수와 개선효과로 후보를 정렬합니다.</p></div></div></section>'}
    function reportText(){const metrics=calc();const best=CONFIG.candidates.map((row,index)=>({index,row,score:candidateScore(row)})).sort((a,b)=>b.score-a.score)[0];return "SupplyGuard 공급망 위험 분석\n"+"문서 구분: 검토용 서비스 화면\n"+"데이터 상태: "+dataStatusLabel()+"\n"+"검증 샘플: 관세청 수출입실적 API 일부 샘플 응답 확인\n"+"미확정 범위: KIPRIS 세부 호출 명세, 전체 원본 데이터 대조\n\n"+"핵심 지표\n"+Object.entries(metrics).map(([metric,value])=>"- "+metric+": "+money(value)).join("\n")+"\n\n"+"우선 후보: "+best.row[0]+" / "+best.row[1]+" / 위험점수 "+money(best.score)+"\n"+"권고: 고위험 품목은 대체 공급처 탐색과 재고 완충 계획을 먼저 검토합니다."}
    function reportPreview(wrap=true){const html='<section class="panel span-12"><h2>대응 리포트</h2><div class="actions"><button type="button" onclick="downloadReport()">보고서 다운로드</button><button class="secondary" type="button" onclick="copyReport()">복사</button><button class="ghost" type="button" onclick="exportJson()">분석 JSON</button></div><div class="report">'+escapeHtml(reportText())+'</div></section>';return wrap?'<div class="grid">'+html+'</div>':html}
    function settings(){return '<div class="grid"><section class="panel span-6"><h2>내보내기</h2><p class="muted">분석 입력값, 지표, 선택 후보, 데이터 상태를 인증정보 없는 파일로 저장합니다.</p><div class="actions"><button type="button" onclick="exportJson()">분석 JSON</button><button class="secondary" type="button" onclick="downloadReport()">보고서</button><button class="ghost" type="button" onclick="copyReport()">복사</button></div></section><section class="panel span-6"><h2>서비스 한계</h2><p>'+sampleData.limitations.map(escapeHtml).join("<br>")+'</p></section></div>'}
    function overview(){return evidencePanel()+kpis()+'<div class="grid"><section class="panel span-7"><h2>서비스 요약</h2><p>KOTRA 공공데이터 활용 구조와 관세청 보조 샘플을 분리해, 심사자가 데이터 경계와 위험 산정 방식을 함께 확인할 수 있도록 구성했습니다.</p><p><span class="chip">공공데이터 구조 기반</span><span class="chip">검증 샘플 표시</span><span class="chip">인증정보 비노출</span><span class="chip">반응형 화면</span></p></section><section class="panel span-5"><h2>선정 후보</h2><strong>'+CONFIG.candidates[selected][0]+' · '+CONFIG.candidates[selected][1]+'</strong><p class="muted">위험수준 '+riskLevel(candidateScore(CONFIG.candidates[selected]))+'</p><p class="label">위험점수 '+money(candidateScore(CONFIG.candidates[selected]))+'</p></section>'+logic()+'</div>'}
    function updateHero(){const risk=calc()["통합 위험점수"];document.getElementById("heroRisk").textContent=money(risk);document.getElementById("heroSummary").textContent="현재 품목은 "+riskLevel(risk)+" 구간입니다. 대응 후보 "+CONFIG.candidates[selected][0]+"을 우선 검토합니다.";document.getElementById("sampleStatus").textContent=sampleReady?"정적 검증 샘플 반영":"예시 입력값과 보조 샘플 표시";document.getElementById("sideStatus").textContent="공공데이터 활용 구조 기반 서비스"}
    function render(){nav();let body="";if(current==="overview")body=overview();if(current==="inputs")body='<div class="grid">'+inputs()+'<div data-soft class="span-12">'+kpis()+reportPreview(false)+'</div></div>';if(current==="candidates")body='<div class="grid">'+candidates()+kpis()+'</div>';if(current==="report")body=reportPreview();if(current==="sources")body='<div class="grid">'+sources()+evidencePanel()+'</div>';if(current==="logic")body='<div class="grid">'+logic()+kpis()+candidates()+'</div>';if(current==="settings")body=settings();document.getElementById("view").innerHTML=body;updateHero()}
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,match=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[match]))}
    function dataStatusLabel(){return sampleData.publicStatus||FALLBACK_SAMPLE.publicStatus}
    function exportJson(){download("supplyguard-analysis.json",JSON.stringify({state,metrics:calc(),candidate:CONFIG.candidates[selected],dataStatus:dataStatusLabel()},null,2),"분석 파일을 저장했습니다.")}
    function downloadReport(){download("supplyguard-report.md",reportText(),"보고서 파일을 저장했습니다.")}
    async function copyReport(){const text=reportText();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);notify("리포트를 복사했습니다.");return}}catch(error){}const area=document.createElement("textarea");area.value=text;area.setAttribute("readonly","");area.style.position="fixed";area.style.left="-9999px";document.body.appendChild(area);area.select();const ok=document.execCommand("copy");area.remove();notify(ok?"리포트를 복사했습니다.":"브라우저 권한 제한으로 복사를 완료하지 못했습니다.")}
    function download(name,text,message){const link=document.createElement("a");link.href=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));link.download=name;link.click();URL.revokeObjectURL(link.href);notify(message)}
    function notify(message){const node=document.getElementById("feedback");node.textContent=message;node.classList.add("show");clearTimeout(window.feedbackTimer);window.feedbackTimer=setTimeout(()=>node.classList.remove("show"),2400)}
    document.getElementById("sampleBtn").onclick=()=>{state={...Object.fromEntries(CONFIG.inputs.map(([field,,value])=>[field,value])),...(sampleData.scoreInputs||{})};render()};
    document.getElementById("saveBtn").onclick=save;
    document.getElementById("resetBtn").onclick=()=>{localStorage.removeItem(CONFIG.storageId);state=load();render()};
    render();loadSample();
  </script>
