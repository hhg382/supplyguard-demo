<!doctype html>
<html lang="ko">
<head>

  <title>SupplyGuard | 공급망 위험 분석</title>
  <style>
    :root{
      --color-primary:#3182F6;--color-primary-hover:#1B64DA;--color-primary-light:#E8F3FF;
      --color-ink:#191F28;--color-ink-secondary:#4E5968;--color-ink-tertiary:#8B95A1;

      --brand:var(--color-primary);--brand-strong:var(--color-primary-hover);--ink:var(--color-ink);
      --muted:var(--color-ink-secondary);--line:var(--color-divider);--surface:var(--color-surface);
      --paper:var(--color-background);--tint:var(--color-primary-light);--good:var(--color-success);
      --warn:var(--color-warning);--bad:var(--color-danger);--s1:4px;--s2:8px;--s3:12px;
      --s4:16px;--s5:24px;--s6:32px;--s8:48px;--radius:var(--radius-l);--shadow:var(--shadow-card);

      --text-caption:13px;--text-number-xl:32px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden}
    body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--color-ink);background:var(--color-background);line-height:1.62;letter-spacing:0}
    button,input,select{font:inherit}
    button{border:0;border-radius:var(--radius-m);background:var(--color-primary);color:#fff;min-height:52px;padding:0 var(--s5);font-weight:700;cursor:pointer;transition:transform .12s ease-out,background .18s ease,box-shadow .18s ease}
    button:hover{background:var(--color-primary-hover);box-shadow:var(--shadow-float)}
    button:active{transform:scale(.97)}
    button.secondary{background:var(--color-surface);color:var(--color-ink);box-shadow:none}
    button.secondary:hover{background:#E9EEF3;box-shadow:none}
    button.ghost{background:transparent;color:var(--color-primary);box-shadow:none;padding-inline:var(--s3)}
    button.ghost:hover{background:var(--color-primary-light);box-shadow:none}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
    a{color:var(--color-primary);overflow-wrap:anywhere}.skip{position:absolute;left:-999px;top:8px;background:#fff;color:var(--color-ink);padding:8px 12px;border-radius:var(--radius-s);z-index:20}.skip:focus{left:8px}
    .feedback{position:fixed;right:16px;bottom:18px;background:var(--color-ink);color:#fff;border-radius:var(--radius-m);padding:12px 16px;box-shadow:var(--shadow-float);opacity:0;transform:translateY(8px);transition:opacity .18s ease,transform .18s ease;z-index:30;max-width:min(420px,calc(100vw - 24px));pointer-events:none}.feedback.show{opacity:1;transform:translateY(0)}
    .app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh;background:linear-gradient(180deg,#fff 0,var(--color-surface) 100%)}
    .side{background:rgba(255,255,255,.92);color:var(--color-ink);padding:var(--s6);position:sticky;top:0;height:100dvh;border-right:1px solid var(--color-divider)}
    .brand{font-size:24px;font-weight:800;margin-bottom:var(--s2);letter-spacing:0}
    .side-note{font-size:13px;color:var(--color-ink-secondary);margin-bottom:var(--s6);word-break:keep-all}
    .nav{display:grid;gap:var(--s1)}.nav button{justify-content:flex-start;background:transparent;color:var(--color-ink-secondary);text-align:left;box-shadow:none;min-height:48px;padding:0 var(--s4);font-weight:700}.nav button:hover,.nav button.active{background:var(--color-primary-light);color:var(--color-primary);box-shadow:none}
    .main{min-width:0;padding:var(--s6);display:grid;gap:var(--s6);max-width:1200px;width:100%;margin:0 auto}
    .hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:var(--s5);align-items:stretch}
    .hero-copy,.hero-card,.panel{background:var(--color-background);border:1px solid var(--color-divider);border-radius:var(--radius-l);box-shadow:var(--shadow-card);min-width:0}
    .hero-copy{padding:var(--s8)}
    .eyebrow{font-size:13px;font-weight:800;color:var(--color-primary);margin:0 0 var(--s4);word-break:keep-all}
    .hero h1{font-size:clamp(34px,4vw,48px);line-height:1.12;margin:0 0 var(--s4);word-break:keep-all;letter-spacing:0;font-weight:800}
    .title-line,.phrase{display:inline-block}.hero p{max-width:64ch;color:var(--color-ink-secondary);margin:0;word-break:keep-all;font-size:16px}.hero-actions{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s6)}
    .hero-card{padding:var(--s6);display:grid;gap:var(--s4);background:linear-gradient(180deg,#fff,var(--color-primary-light))}
    .risk-value{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--color-primary);letter-spacing:0}
    .status-pill{display:inline-flex;align-items:center;width:max-content;min-height:32px;padding:0 var(--s3);border-radius:var(--radius-full);background:#fff;color:var(--color-success);font-size:13px;font-weight:800}
    .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--s4)}.panel{padding:var(--s6)}.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
    .panel h2,.panel h3{margin:0 0 var(--s3);word-break:keep-all;letter-spacing:0}.panel h2{font-size:var(--text-title);font-weight:800}.panel h3{font-size:var(--text-heading);font-weight:700}.label{font-size:var(--text-caption);color:var(--color-ink-tertiary);font-weight:800}.muted{color:var(--color-ink-secondary)}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s4)}
    .kpi{display:grid;gap:var(--s2)}.kpi strong{font-size:var(--text-number-xl);font-weight:800;font-variant-numeric:tabular-nums;color:var(--color-ink)}.meter{height:8px;border-radius:var(--radius-full);background:var(--color-surface);overflow:hidden}.meter span{display:block;height:100%;background:var(--color-primary);width:30%;transition:width .22s ease}
    .evidence{background:var(--color-primary-light);border-color:transparent}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}.source-card{border:1px solid var(--color-divider);border-radius:var(--radius-m);background:#fff;padding:var(--s4);min-width:0}.source-card strong{display:block;color:var(--color-ink);font-size:18px;font-weight:800}.source-card p{margin:var(--s1) 0 0;color:var(--color-ink-secondary);font-size:var(--text-caption);word-break:keep-all}
    .form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}.field{display:grid;gap:var(--s1)}.field label{font-size:var(--text-caption);color:var(--color-ink-secondary);font-weight:800}.field input,.field select{width:100%;min-height:52px;border:1px solid transparent;border-radius:var(--radius-m);padding:10px 14px;background:var(--color-surface);color:var(--color-ink)}
    .actions,.chips{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}.chips{margin:var(--s4) 0}
    .toolbar{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-bottom:var(--s4)}.toolbar input{min-height:52px;border:1px solid transparent;border-radius:var(--radius-m);padding:10px 14px;background:var(--color-surface);min-width:min(360px,100%)}
    .table-wrap{width:100%;overflow-x:auto;border:1px solid var(--color-divider);border-radius:var(--radius-m);background:#fff}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:14px 16px;border-bottom:1px solid var(--color-divider);text-align:left;font-size:14px;vertical-align:top;word-break:keep-all}th{background:#FAFBFC;color:var(--color-ink-secondary);font-weight:800}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.selected{background:var(--color-primary-light)}
    .report{white-space:pre-wrap;background:var(--color-ink);color:#fff;border-radius:var(--radius-m);padding:var(--s5);min-height:260px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.7}.chip{display:inline-flex;align-items:center;min-height:34px;border:0;border-radius:var(--radius-full);padding:0 12px;background:var(--color-surface);color:var(--color-ink-secondary);font-size:13px;font-weight:700;margin:2px}.action-chip{background:var(--color-primary-light);color:var(--color-primary);min-height:36px;padding:0 14px;box-shadow:none}.action-chip:hover{background:#DDEEFF;box-shadow:none}
    .flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}.step{background:#FAFBFC;border-radius:var(--radius-m);padding:var(--s4);border:1px solid var(--color-divider)}.step strong{display:block;color:var(--color-primary);margin-bottom:var(--s1)}.step p{margin:0;word-break:keep-all}
    .mobilebar{display:none}.status-good{color:var(--color-success)}.status-warn{color:#A66A00}.status-bad{color:var(--color-danger)}.footer{font-size:12px;color:var(--color-ink-tertiary);padding-bottom:var(--s2);word-break:keep-all}
    @media(max-width:1024px){.app{grid-template-columns:1fr}.side{display:none}.hero{grid-template-columns:1fr}.main{padding:var(--s5)}.span-3,.span-4,.span-5,.span-6,.span-7,.span-8{grid-column:span 6}.cards,.form,.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:768px){body{padding-bottom:78px}.main{padding:20px 16px 24px;gap:var(--s5)}.hero-copy,.hero-card,.panel{border-radius:var(--radius-l)}.hero-copy{padding:var(--s6)}.hero h1{font-size:34px}.hero p{font-size:15px}.hero-actions button{flex:1 1 100%}.grid,.cards,.form,.flow{grid-template-columns:1fr}.span-3,.span-4,.span-5,.span-6,.span-7,.span-8,.span-12{grid-column:span 1}table{display:table;min-width:820px}.actions button{flex:1 1 128px}.feedback{left:12px;right:12px;bottom:86px}.mobilebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--color-divider);padding:8px;gap:6px;z-index:10;overflow:hidden}.mobilebar button{min-width:0;min-height:54px;padding:0 6px;font-size:12px;background:transparent;color:var(--color-ink-secondary);box-shadow:none}.mobilebar button.active{background:var(--color-primary);color:#fff}.panel{padding:var(--s5)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <a class="skip" href="#content">본문으로 이동</a>
  <div class="app">
    <aside class="side" aria-label="서비스 메뉴">
      <div class="brand">SupplyGuard</div>
      <div class="side-note" id="sideStatus">위험 품목을 먼저 확인해요</div>
      <div class="nav" id="nav"></div>
    </aside>
    <main class="main" id="content">
      <section class="hero" aria-labelledby="pageTitle">
        <div class="hero-copy">
          <p class="eyebrow">SupplyGuard</p>
          <h1 id="pageTitle"><span class="title-line">수입의존 위험 품목</span> <span class="title-line">모니터</span></h1>
          <p>HS 코드와 품목명을 넣으면 의존도, 위험 신호, 대체 조달 후보를 한 번에 정리합니다. 공공데이터 활용 구조는 보여주되, 인증정보는 공개 화면에 두지 않습니다.</p>
          <div class="hero-actions">
            <button id="sampleBtn" type="button">품목 위험도 확인하기</button>
            <button class="secondary" id="saveBtn" type="button">분석 저장</button>
            <button class="ghost" id="resetBtn" type="button">초기화</button>
          </div>
        </div>
        <div class="hero-card" aria-live="polite">
          <span class="status-pill" id="sampleStatus">검토용 서비스 화면</span>
          <div>
            <div class="label">통합 위험점수</div>
            <div class="risk-value" id="heroRisk">-</div>
          </div>
          <p class="muted" id="heroSummary">품목을 선택하면 위험도와 다음 대응을 바로 보여줍니다.</p>
        </div>
      </section>
      <section id="view"></section>
      <p class="footer">공개 화면에는 인증정보와 원본 요청 URL을 포함하지 않습니다. 전체 원본 데이터 대조는 별도 검증 단계에서 수행합니다.</p>
    </main>
  </div>
  <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
  <nav class="mobilebar" id="mobilebar" aria-label="모바일 메뉴"></nav>
  <script>
    const CONFIG={name:"SupplyGuard",storageId:"publicdata:supplyguard:polished",inputs:[["company","기업명","한빛소재"],["hsCode","HS 코드","280461"],["itemName","품목명","실리콘 웨이퍼 원재료"],["importTotal","월 수입액(만달러)",860],["topShare","1위 국가 비중(%)",64],["secondShare","2위 국가 비중(%)",18],["thirdShare","3위 국가 비중(%)",9],["newsHits","위험 뉴스 건수",7],["stockDays","재고일수",24],["criticality","생산 중요도(1~10)",9],["threshold","경보 임계점",70],["supplierCount","대체 공급처 수",2]],data:[["한국무역현황 상세통계","KOTRA","15140428","HS코드·국가·수출입액","핵심 산업부 데이터 구조"],["국가정보","KOTRA","15034830","국가·경제·정치·시장정보","국가 리스크 보정"],["해외시장뉴스","KOTRA","15034831","통상 뉴스·국가·품목","위험 신호 탐지"],["품목별 국가별 수출입실적","관세청","보조 샘플","수입액·수출액","일부 샘플 응답 확인"],["KIPRIS 특허정보","특허청","보조 후보","특허·기술분류","대체 기술 후보 설계"]],candidates:[["280461","고순도 실리콘",91,71,12],["850760","리튬이온 배터리",84,63,8],["854231","집적회로",76,54,5],["290243","p-자일렌",68,47,4],["280530","희토류 금속",87,69,10]]};
    const FALLBACK_SAMPLE={dataStatus:"관세청 보조 샘플 확인",publicStatus:"검증 샘플 반영 예시 데이터",source:"관세청 수출입실적 API 일부 샘플 응답 확인",kotraStatus:"KOTRA 데이터는 서비스 핵심 공공데이터로 설계 반영",kiprisStatus:"KIPRIS 데이터는 대체기술 보조 데이터로 설계 반영",items:[{hsCode:"8542",countryCode:"US",periodLabel:"조회 기준 기간",importUsd:"227207303",exportUsd:"60050850",balanceUsd:"-",source:"관세청 품목별 국가별 수출입실적 API 일부 샘플 응답"}],scoreInputs:{newsHits:7,topShare:64,criticality:9,supplierCount:2,stockDays:24},limitations:["브라우저는 인증정보 없이 정적 JSON만 읽습니다.","관세청 수출입실적은 기타 보조 샘플로만 사용합니다.","KOTRA 원본 파일 대조와 KIPRIS 세부 호출 검증은 별도 단계입니다."]};
    const candidateMeta={"280461":["중국·미국 공급 편중","일본·독일","대체 조달처와 안전재고를 먼저 확인"],"850760":["배터리 소재 가격 변동","폴란드·헝가리","장기 구매계약과 재고 완충 검토"],"854231":["첨단 공정 병목 가능성","대만·싱가포르","핵심 협력사 이원화 검토"],"290243":["석유화학 원료 가격 민감도","일본·대만","가격 경보와 계약 조건 재점검"],"280530":["희소금속 수급 불안","호주·베트남","전략 비축과 대체 소재 검토"]};
    const presets={semiconductor:{hsCode:"854231",itemName:"집적회로",topShare:58,secondShare:24,thirdShare:8,newsHits:6,stockDays:28,criticality:9,supplierCount:3},rare:{hsCode:"280530",itemName:"희토류 금속",topShare:72,secondShare:12,thirdShare:7,newsHits:9,stockDays:18,criticality:10,supplierCount:2},battery:{hsCode:"850760",itemName:"리튬이온 배터리",topShare:61,secondShare:19,thirdShare:8,newsHits:8,stockDays:22,criticality:9,supplierCount:3}};
    const tabs=[["overview","대시보드"],["inputs","품목 입력"],["candidates","대체 후보"],["report","리포트"],["sources","데이터 근거"],["logic","산정 로직"],["review","검토 체크"],["settings","내보내기"]];
    let current=new URLSearchParams(location.search).get("view")||"overview";if(!tabs.some(([id])=>id===current))current="overview";
    const mobileTabs=tabs.filter(([id])=>["overview","inputs","candidates","report"].includes(id));
    let selected=0;let sampleData=FALLBACK_SAMPLE;let sampleReady=false;let state=load();
    function load(){try{return {...Object.fromEntries(CONFIG.inputs.map(([field,,value])=>[field,value])),...JSON.parse(localStorage.getItem(CONFIG.storageId)||"{}")}}catch{return Object.fromEntries(CONFIG.inputs.map(([field,,value])=>[field,value]))}}
    function save(){localStorage.setItem(CONFIG.storageId,JSON.stringify(state));render();notify("입력값을 저장했습니다. 이어서 리포트를 확인해 보세요.")}
    function num(k){const value=Number(state[k]);return Number.isFinite(value)?value:0}
    async function loadSample(){if(location.protocol==="file:"){render();return}try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),2500);const response=await fetch("data/supplyguard-sample.json",{cache:"no-store",signal:controller.signal});clearTimeout(timer);if(response.ok){sampleData={...FALLBACK_SAMPLE,...await response.json()};sampleReady=true;if(sampleData.scoreInputs&&!localStorage.getItem(CONFIG.storageId))state={...state,...sampleData.scoreInputs}}}catch(error){sampleReady=false}render()}
    function money(value){return Number(value).toLocaleString("ko-KR",{maximumFractionDigits:1})}
    function moneyUsd(value){const parsed=Number(value);return Number.isFinite(parsed)?parsed.toLocaleString("ko-KR")+" 달러":"확인 필요"}
    function calc(){const shares=[num("topShare"),num("secondShare"),num("thirdShare"),Math.max(0,100-num("topShare")-num("secondShare")-num("thirdShare"))];const hhi=shares.reduce((sum,value)=>sum+value*value,0);const news=Math.min(100,num("newsHits")*9+num("criticality")*3);const risk=Math.min(100,hhi/100+news*.25+num("criticality")*2-num("supplierCount")*3-num("stockDays")*.2);return {"HHI":hhi,"단일국 의존도":num("topShare"),"뉴스 리스크":news,"재고 완충일":num("stockDays"),"통합 위험점수":risk}}
    function candidateScore(row){const metrics=calc();const base=Object.values(metrics).reduce((sum,value)=>sum+Number(value||0),0)/Object.keys(metrics).length;return Math.max(0,Math.min(100,row[2]*.55+base*.35-row[4]*1.5+row[3]*.1))}
    function riskLevel(score){if(score>=80)return "고위험";if(score>=65)return "주의";return "관찰"}
    function nav(){document.getElementById("nav").innerHTML=tabs.map(navButton).join("");document.getElementById("mobilebar").innerHTML=mobileTabs.map(navButton).join("")}
    function navButton([id,label]){return '<button type="button" class="'+(current===id?"active":"")+'" onclick="current=\''+id+'\';render()">'+label+'</button>'}
    function kpis(){const metrics=calc();return '<div class="kpi-grid span-12">'+Object.entries(metrics).map(([metric,value])=>'<article class="panel kpi"><span class="label">'+metric+'</span><strong>'+money(value)+'</strong><div class="meter"><span style="width:'+Math.max(8,Math.min(100,Number(value)%110))+'%"></span></div></article>').join("")+'</div>'}
    function evidencePanel(){const item=sampleData.items?.[0]||FALLBACK_SAMPLE.items[0];return '<section class="panel evidence span-12"><h2>데이터 활용 상태</h2><p class="muted"><span class="phrase">KOTRA 데이터는 서비스의 핵심 공공데이터 구조로 반영했습니다.</span> <span class="phrase">관세청 수출입실적 API 일부 샘플 응답은 보조 근거로만 사용합니다.</span></p><div class="cards"><div class="source-card"><span class="label">화면 상태</span><strong>'+escapeHtml(dataStatusLabel())+'</strong><p>예시 입력값과 검증 샘플 지표를 함께 보여줍니다.</p></div><div class="source-card"><span class="label">관세청 보조 샘플</span><strong>'+escapeHtml(item.hsCode)+' · '+escapeHtml(item.countryCode)+'</strong><p>수입 '+escapeHtml(moneyUsd(item.importUsd))+' / 수출 '+escapeHtml(moneyUsd(item.exportUsd))+'</p></div><div class="source-card"><span class="label">확장 검토</span><strong>KOTRA·KIPRIS</strong><p>KOTRA는 핵심 구조, KIPRIS는 대체기술 검토 보조 데이터입니다.</p></div></div></section>'}
    function inputs(){return '<section class="panel span-12"><h2>어떤 품목의 수입 의존도를 볼까요?</h2><p class="muted">HS 코드나 품목명을 바꾸면 위험도와 권고가 함께 갱신됩니다.</p><div class="chips"><button class="chip action-chip" type="button" onclick="applyPreset(&quot;semiconductor&quot;)">반도체</button><button class="chip action-chip" type="button" onclick="applyPreset(&quot;rare&quot;)">희토류</button><button class="chip action-chip" type="button" onclick="applyPreset(&quot;battery&quot;)">배터리 소재</button></div><div class="form">'+CONFIG.inputs.map(([field,label])=>'<div class="field"><label for="'+field+'">'+label+'</label><input id="'+field+'" value="'+escapeHtml(state[field]??"")+'" placeholder="'+label+' 입력" oninput="state[\''+field+'\']=this.value;renderSoft()"></div>').join("")+'</div></section>'}
    function renderSoft(){const softHtml=current==="inputs"?kpis()+reportPreview(false):kpis();document.querySelectorAll("[data-soft]").forEach(node=>node.innerHTML=softHtml);updateHero()}
    function candidateRows(){const query=(document.getElementById("search")?.value||"").trim();return CONFIG.candidates.filter(row=>query===""||row.join(" ").includes(query)).map(row=>{const meta=candidateMeta[row[0]]||["수입 집중도 확인 필요","복수 후보 검토","공급처와 재고 계획을 함께 검토"];return '<tr class="'+(CONFIG.candidates[selected]===row?"selected":"")+'" onclick="selected='+CONFIG.candidates.indexOf(row)+';render()"><td>'+row[0]+'</td><td>'+row[1]+'</td><td>'+meta[0]+'</td><td><strong>'+riskLevel(candidateScore(row))+'</strong><br>'+money(candidateScore(row))+'</td><td>'+meta[1]+'</td><td>'+meta[2]+'</td></tr>'}).join("")}
    function candidates(){return '<section class="panel span-12"><div class="toolbar"><div><h2>위험 품목을 먼저 확인해요</h2><p class="muted">품목별 위험 사유, 대체 후보, 권고 조치를 한 표에서 비교합니다. 모바일에서는 표를 좌우로 밀어 전체 항목을 확인할 수 있습니다.</p></div><input id="search" placeholder="HS 코드 또는 품목 검색" oninput="document.querySelector(&quot;tbody&quot;).innerHTML=candidateRows()"></div><div class="actions"><button class="secondary" type="button" onclick="sortCandidates()">위험도 높은 순</button><button class="ghost" type="button" onclick="selected=(selected+1)%CONFIG.candidates.length;render()">다음 후보 보기</button></div><div class="table-wrap" aria-label="좌우 스크롤 가능한 후보 비교표"><table><thead><tr><th>HS 코드</th><th>품목</th><th>주요 위험 사유</th><th>위험도</th><th>대체국 후보</th><th>권고 조치</th></tr></thead><tbody>'+candidateRows()+'</tbody></table></div></section>'}
    function sortCandidates(){CONFIG.candidates.sort((a,b)=>candidateScore(b)-candidateScore(a));selected=0;render()}
    function sources(){return '<section class="panel span-12"><h2>공공데이터 근거</h2><p class="muted">KOTRA 3종 데이터는 핵심 산업부 공공데이터 구조입니다. 관세청과 KIPRIS는 위험 판단을 보완하는 보조 데이터로 분리했습니다.</p><div class="cards">'+CONFIG.data.map(row=>'<div class="source-card"><span class="label">'+row[1]+' · '+row[2]+'</span><strong>'+row[0]+'</strong><p>'+row[3]+'</p><p>'+row[4]+'</p></div>').join("")+'</div></section>'}
    function logic(){return '<section class="panel span-12"><h2>위험 산정 로직</h2><div class="flow"><div class="step"><strong>1. 품목 식별</strong><p>HS 코드와 품목명으로 분석 단위를 먼저 고정합니다.</p></div><div class="step"><strong>2. 의존도 계산</strong><p>상위 국가 비중으로 HHI와 단일국 의존도를 계산합니다.</p></div><div class="step"><strong>3. 위험 신호 보정</strong><p>뉴스 신호, 생산 중요도, 재고 완충일을 함께 반영합니다.</p></div><div class="step"><strong>4. 다음 행동 제안</strong><p>대체 공급처 수와 개선효과를 비교해 우선순위를 보여줍니다.</p></div></div></section>'}
    function logicFormula(){return '<section class="panel span-12"><h2>점수 해석</h2><div class="cards"><div class="source-card"><span class="label">의존도</span><strong>HHI + 단일국 비중</strong><p>수입이 한 국가에 몰릴수록 기본 위험을 높입니다.</p></div><div class="source-card"><span class="label">위험 신호</span><strong>뉴스 + 생산 중요도</strong><p>통상 이슈와 생산 차질 민감도를 함께 보정합니다.</p></div><div class="source-card"><span class="label">완충력</span><strong>재고 + 공급처 수</strong><p>재고일수와 대체 공급처가 많을수록 위험을 낮춥니다.</p></div></div></section>'}
    function reportText(){const metrics=calc();const best=CONFIG.candidates.map((row,index)=>({index,row,score:candidateScore(row)})).sort((a,b)=>b.score-a.score)[0];const meta=candidateMeta[best.row[0]]||["수입 집중도 확인 필요","복수 후보 검토","공급처와 재고 계획을 함께 검토"];return "SupplyGuard 수입의존 위험 품목 요약\n"+"문서 구분: 검토용 서비스 화면\n"+"데이터 상태: "+dataStatusLabel()+"\n"+"확인된 보조 근거: 관세청 수출입실적 API 일부 샘플 응답 확인\n"+"아직 필요한 검증: KIPRIS 세부 호출 명세, 전체 원본 데이터 대조\n\n"+"핵심 지표\n"+Object.entries(metrics).map(([metric,value])=>"- "+metric+": "+money(value)).join("\n")+"\n\n"+"먼저 볼 품목: "+best.row[0]+" / "+best.row[1]+" / 위험도 "+riskLevel(best.score)+"("+money(best.score)+")\n"+"주요 위험 사유: "+meta[0]+"\n"+"대체국 후보: "+meta[1]+"\n"+"권고 조치: "+meta[2]}
    function reportPreview(wrap=true){const html='<section class="panel span-12"><h2>요약 리포트로 바로 정리해요</h2><div class="actions"><button type="button" onclick="downloadReport()">리포트 저장</button><button class="secondary" type="button" onclick="copyReport()">내용 복사</button><button class="ghost" type="button" onclick="exportJson()">분석 JSON</button></div><div class="report">'+escapeHtml(reportText())+'</div></section>';return wrap?'<div class="grid">'+html+'</div>':html}
    function settings(){return '<div class="grid"><section class="panel span-6"><h2>내보내기</h2><p class="muted">입력값, 지표, 선택 후보, 데이터 상태를 인증정보 없는 파일로 저장합니다.</p><div class="actions"><button type="button" onclick="exportJson()">분석 JSON</button><button class="secondary" type="button" onclick="downloadReport()">리포트</button><button class="ghost" type="button" onclick="copyReport()">복사</button></div></section><section class="panel span-6"><h2>확인할 한계</h2><p>'+sampleData.limitations.map(escapeHtml).join("<br>")+'</p></section></div>'}
    function overview(){const row=CONFIG.candidates[selected];const meta=candidateMeta[row[0]]||["수입 집중도 확인 필요","복수 후보 검토","공급처와 재고 계획을 함께 검토"];return '<div class="grid">'+inputs()+'<div data-soft class="span-12">'+kpis()+'</div><section class="panel span-7"><h2>공공데이터 기반으로 판단 흐름을 보여줘요</h2><p>KOTRA 공공데이터 활용 구조와 관세청 보조 샘플을 분리해, 데이터 경계와 위험 산정 방식을 함께 확인할 수 있도록 구성했습니다.</p><p><span class="chip">공공데이터 구조 기반</span><span class="chip">검증 샘플 표시</span><span class="chip">인증정보 비노출</span></p></section><section class="panel span-5"><h2>먼저 볼 품목</h2><strong>'+row[0]+' · '+row[1]+'</strong><p class="muted">'+meta[0]+'</p><p class="label">위험도 '+riskLevel(candidateScore(row))+' · '+money(candidateScore(row))+'</p></section>'+evidencePanel()+logic()+'</div>'}
    function updateHero(){const risk=calc()["통합 위험점수"];document.getElementById("heroRisk").textContent=money(risk);document.getElementById("heroSummary").textContent="현재 품목은 "+riskLevel(risk)+" 구간입니다. 대체 조달 후보를 함께 확인해 보세요.";document.getElementById("sampleStatus").textContent=sampleReady?"정적 검증 샘플 반영":"예시 데이터 기반 화면";document.getElementById("sideStatus").textContent="위험 품목을 먼저 확인해요"}
    function render(){nav();let body="";if(current==="overview")body=overview();if(current==="inputs")body='<div class="grid">'+inputs()+'<div data-soft class="span-12">'+kpis()+reportPreview(false)+'</div></div>';if(current==="candidates")body='<div class="grid">'+candidates()+kpis()+'</div>';if(current==="report")body=reportPreview();if(current==="sources")body='<div class="grid">'+sources()+evidencePanel()+'</div>';if(current==="logic")body='<div class="grid">'+logic()+kpis()+logicFormula()+'</div>';if(current==="review")body=review();if(current==="settings")body=settings();document.getElementById("view").innerHTML=body;updateHero()}
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,match=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[match]))}
    function applyPreset(name){state={...state,...(presets[name]||{})};render();notify("예시 품목을 불러왔습니다. 위험도를 바로 확인해 보세요.")}
    function review(){return '<div class="grid"><section class="panel span-12"><h2>검토 체크</h2><div class="cards"><div class="source-card"><span class="label">공개 URL</span><strong>GitHub Pages</strong><p>제출 URL에서 같은 화면을 제공합니다.</p></div><div class="source-card"><span class="label">데이터 경계</span><strong>정적 공개 JSON</strong><p>관세청 보조 샘플과 예시 입력값을 분리해 표시합니다.</p></div><div class="source-card"><span class="label">보안 경계</span><strong>인증정보 비노출</strong><p>브라우저에는 키와 원본 요청 URL을 넣지 않습니다.</p></div></div></section>'+evidencePanel()+reportPreview(false)+'</div>'}
    function dataStatusLabel(){return sampleData.publicStatus||FALLBACK_SAMPLE.publicStatus}
    function exportJson(){download("supplyguard-analysis.json",JSON.stringify({state,metrics:calc(),candidate:CONFIG.candidates[selected],dataStatus:dataStatusLabel()},null,2),"분석 파일을 저장했습니다.")}
    function downloadReport(){download("supplyguard-report.md",reportText(),"보고서 파일을 저장했습니다.")}
    async function copyReport(){const text=reportText();let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);copied=true}}catch(error){copied=false}if(copied){notify("리포트를 복사했습니다.");return}const area=document.createElement("textarea");area.value=text;area.setAttribute("readonly","");area.style.position="fixed";area.style.left="-9999px";document.body.appendChild(area);area.select();const ok=document.execCommand("copy");area.remove();notify(ok?"리포트를 복사했습니다.":"브라우저 권한 제한으로 복사를 완료하지 못했습니다.")}
    function download(name,text,message){const link=document.createElement("a");link.href=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));link.download=name;link.click();URL.revokeObjectURL(link.href);notify(message)}
    function notify(message){const node=document.getElementById("feedback");node.textContent=message;node.classList.add("show");clearTimeout(window.feedbackTimer);window.feedbackTimer=setTimeout(()=>node.classList.remove("show"),2400)}
    document.getElementById("sampleBtn").onclick=()=>{state={...Object.fromEntries(CONFIG.inputs.map(([field,,value])=>[field,value])),...(sampleData.scoreInputs||{})};render();notify("품목 위험도를 계산했습니다. 아래 결과를 확인해 보세요.")};
    document.getElementById("saveBtn").onclick=save;
    document.getElementById("resetBtn").onclick=()=>{localStorage.removeItem(CONFIG.storageId);state=load();render()};
    render();loadSample();
  </script>
  <!-- 기능 목록: 1 입력 저장, 2 샘플 입력, 3 폼 초기화, 4 KPI 재계산, 5 HS 코드 분석, 6 품목명 분석, 7 수입액 입력, 8 국가 비중 입력, 9 뉴스 리스크 입력, 10 재고일수 입력, 11 생산 중요도 입력, 12 공급처 수 입력, 13 HHI 계산, 14 단일국 의존도 계산, 15 뉴스 리스크 계산, 16 재고 완충일 표시, 17 통합 위험점수 계산, 18 위험수준 판정, 19 후보 점수 계산, 20 후보 선택, 21 후보 정렬, 22 후보 검색, 23 다음 후보 이동, 24 대시보드 탭, 25 분석 입력 탭, 26 품목 후보 탭, 27 리포트 탭, 28 데이터 탭, 29 산정 로직 탭, 30 검토 체크 탭, 31 내보내기 탭, 32 데스크톱 사이드 내비, 33 모바일 핵심 탭, 34 정적 JSON 로드, 35 내장 샘플 대체 표시, 36 관세청 샘플 카드, 37 KOTRA 구조 카드, 38 KIPRIS 한계 표시, 39 데이터 상태 패널, 40 인증정보 비노출 고지, 41 원본 대조 한계 고지, 42 KPI 진행 막대, 43 히어로 위험점수, 44 히어로 권고 문구, 45 서비스 요약, 46 데이터 근거 목록, 47 위험 산정 4단계, 48 대응 리포트 생성, 49 리포트 다운로드, 50 리포트 복사, 51 분석 JSON 다운로드, 52 localStorage 복원, 53 저장 완료 안내, 54 다운로드 완료 안내, 55 복사 완료 안내, 56 복사 제한 안내, 57 모바일 표 스크롤 안내, 58 숫자 포맷, 59 달러 포맷, 60 데이터 출처 카드, 61 상태 배지, 62 선택 행 표시, 63 행 hover 표시, 64 활성 탭 표시, 65 모션 축소 대응, 66 본문 바로가기, 67 공공데이터 출처 구분, 68 핵심 데이터와 보조 데이터 분리, 69 품목 검색 필터, 70 후보별 기준점수 표시, 71 후보별 개선효과 표시, 72 후보별 투자 리스크 표시, 73 후보별 위험점수 표시, 74 관세청 수입액 표시, 75 관세청 수출액 표시, 76 공급처 수 보정, 77 경보 임계점 입력 유지, 78 리포트 한계 문구, 79 데이터 역할 분리, 80 산업부 데이터 라벨, 81 보조 데이터 라벨, 82 파일 직접 열기 대응, 83 요청 URL 비노출 안내, 84 입력 라벨, 85 반응형 액션 버튼, 86 데스크톱 히어로, 87 모바일 히어로, 88 태블릿 그리드, 89 콘텐츠 최대 폭, 90 가로 넘침 억제, 91 표 헤더 명확화, 92 위험 후보 비교, 93 위험 권고 문구, 94 공개 문구 정리, 95 저장 초기화, 96 클립보드 예외 처리, 97 다운로드 객체 정리, 98 샘플 상태 대체 문구, 99 사이드 상태 문구, 100 샘플 점수 입력 병합, 101 검증 샘플 상태 표시, 102 데이터 한계 목록, 103 후보 위험수준, 104 리포트 일반 텍스트, 105 서비스 흐름 확인, 106 공개 URL 검토 카드, 107 데이터 경계 검토 카드, 108 보안 경계 검토 카드 -->
