name: Refresh SupplyGuard live data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: supplyguard-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build public live-data snapshot
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python .github/scripts/build_live_data.py
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/supplyguard-live.json
          if git diff --cached --quiet; then
            echo "No live-data changes to commit"
          else
            git commit -m "refresh supplyguard live api snapshot"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html v1.html 404.html README.md .nojekyll _site/
          cp data/supplyguard-live.json _site/data/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
